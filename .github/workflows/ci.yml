name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.28.0"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated Payload types
        run: |
          pnpm generate:types
          git diff --exit-code -- src/payload-types.ts

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run editorial and security unit tests
        run: pnpm test:unit

      - name: Run Vitest suite
        run: pnpm test

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Sync compose contract
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: compose.yaml
          target: ${{ vars.DEPLOY_PATH || '/opt/codeguy' }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/codeguy' }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            previous_container="$(docker compose ps -q app)"
            previous_image=""
            if [ -n "$previous_container" ]; then
              previous_image="$(docker inspect --format '{{.Config.Image}}' "$previous_container")"
            fi
            export APP_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            docker compose pull app
            expected_revision="${{ github.sha }}"
            if ! docker compose up -d --no-deps --wait app \
              || ! curl --retry 5 --retry-delay 2 --fail --silent "http://localhost:3000/api/health?revision=$expected_revision" | grep --fixed-strings "\"revision\":\"$expected_revision\"" \
              || ! curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent "https://codeguy.cz/api/health?revision=$expected_revision" | grep --fixed-strings "\"revision\":\"$expected_revision\""; then
              if [ -n "$previous_image" ]; then
                export APP_IMAGE="$previous_image"
                docker compose up -d --no-deps --wait app
              fi
              exit 1
            fi
            docker image prune -f
