services:
  # PostgreSQL Database for Development
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-codeguy}-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_NAME:-codeguy}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  # Next.js Web Application (Development with hot reload)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-codeguy}-dev-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret-min-32-characters-long}
      DATABASE_URI: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-dev_password}@db:5432/${DB_NAME:-codeguy}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - dev-network
    command: pnpm dev

volumes:
  postgres_dev_data:
    driver: local

networks:
  dev-network:
    driver: bridge
