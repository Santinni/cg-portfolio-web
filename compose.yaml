services:
  app:
    image: ${APP_IMAGE:-cg-portfolio-web:local}
    build:
      context: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    env_file: ./.env
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-codeguy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  db_data:
